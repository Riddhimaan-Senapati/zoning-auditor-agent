# Dev ground truth for the April 2025 "Correcting Zoning Code Errors" round.
# One entry per instance in Articles 53 and 65 (design §2), plus the two TA 454
# entries, which are out of scope because they show only across 17 articles.
#
# pre_text is pre-correction text the auditor can quote: the struck text of a
# substitution, or the unchanged wording around an insertion. post_text is the
# corrected reading. matched_edit names the tools/unredline.py edit (page and pair)
# each entry was drafted from; every entry has one. The two Art 65 missing-row
# entries describe an absence, so their pre_text is the district code and their
# page is where the correction inserts the row.
#
# Article 53 in-scope count: 26 (3 district names + 1 Table A fn 2 ambiguity +
# 5 accessory rename + 16 footnote refs + 1 self-reference).

