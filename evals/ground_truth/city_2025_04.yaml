# --- Article 53, row 4: Table A footnote 2 clarified (ambiguity) ---
# The pre-correction footnote 2 stated only the >55ft case; the correction INSERTS
# a sentence covering the <=55ft case (p24 is a pure green insertion, no struck
# text). pre_text is the pre-correction sentence actually present in Table A fn 2,
# which the auditor flags as ambiguous (silent on Lot Frontage of 55 feet or less).
- id: 53-tableA-fn2
  article: "53"
  location: "Table A, footnote 2 (EBR-3 occupancy)"
  section_id: "53:TableA:fn2"
  pre_text: "Where designated \"A,\" and the Lot Frontage is over fifty-five (55) feet, up to six (6) dwelling units are allowed."
  post_text: "Where designated \u201cA,\u201d and the Lot Frontage is over fifty-five (55) feet, up to six (6) dwelling units are allowed. Where designated \u201cA,\u201d and the Lot Frontage is fifty-five (55) feet or less, up to three (3) dwelling units are allowed."
  class: ambiguity
  in_scope: true
  summary_item: "Table A fn 2 ambiguity"
  redline_page: 24
  matched_edit: "p24 insertion: \u201cWhere designated \u201cA,\u201d and the Lot Frontage is fifty-five (55) feet or less, up to three (3) dwelling units are allowed.\u201d"

